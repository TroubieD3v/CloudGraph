apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-sa
  namespace: shop
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-config-reader
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["web-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-config-binding
  namespace: shop
subjects:
  - kind: ServiceAccount
    name: web-sa
    namespace: shop
roleRef:
  kind: Role
  name: web-config-reader
  apiGroup: rbac.authorization.k8s.io
