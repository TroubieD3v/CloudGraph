name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web

  docker:
    # The README's quick start: build the image, then use it as a scanner and as a server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t cloudgraph --build-arg VERSION=ci .
      - run: docker run --rm cloudgraph version
      - run: docker run --rm -v "$PWD/examples/insecure-kubernetes:/in:ro" cloudgraph scan /in
      - name: Server answers with the embedded UI
        run: |
          docker run -d --name cg -p 127.0.0.1:8080:8080 cloudgraph
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">' || { docker logs cg; exit 1; }
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"demo":"insecure-kubernetes"}'             http://127.0.0.1:8080/api/analyses | grep -q '"paths"' || { docker logs cg; exit 1; }
          docker rm -f cg

  scan-examples:
    # Dogfooding: run the CLI the way a user's pipeline would and publish SARIF.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run ./cmd/cloudgraph scan ./examples/hardened-infrastructure --format sarif --output results.sarif --fail-on high
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          category: cloudgraph

      # The hardened project only proves the gate stays green. The intentionally
      # vulnerable projects prove it turns red and that the SARIF is complete and
      # schema-valid. Kept as an artifact, not uploaded to code scanning, so demo
      # findings do not show up as alerts of this repository.
      - name: Vulnerable config fails the gate
        run: |
          set +e
          go run ./cmd/cloudgraph scan ./examples/vulnerable-ecommerce ./examples/insecure-kubernetes \
            --format sarif --output vulnerable.sarif --fail-on high
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1 (findings at or above high), got $code"; exit 1; fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Vulnerable SARIF is schema-valid and complete
        run: |
          pip install --quiet jsonschema
          curl -fsSL -o sarif-schema.json https://json.schemastore.org/sarif-2.1.0.json
          python scripts/check_sarif.py vulnerable.sarif sarif-schema.json --min-findings 50 --min-paths 10
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: vulnerable-sarif
          path: vulnerable.sarif
