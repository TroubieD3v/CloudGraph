name: Feature request
description: A new rule, input format, graph relationship or UI improvement
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What should CloudGraph do
      description: For a rule, include a vulnerable and a fixed example.
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Which attack path or decision it helps with.
